<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f"><title>You're offline · RedRoom254</title>
<style>
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{background:#0a0a0f;color:#e8e8f0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .box{max-width:320px} img{width:84px;height:84px;border-radius:20px;margin-bottom:20px;opacity:.95}
  h1{font-size:20px;margin:0 0 8px} p{margin:0 0 24px;color:#9a9ab0;font-size:14px;line-height:1.5}
  button{background:#ff2d4e;color:#fff;border:0;border-radius:14px;padding:13px 26px;font-size:15px;font-weight:600;width:100%}
  button:active{transform:scale(.97)}
</style></head>
<body><div class="box">
  <img src="/logo-mark.png" alt="">
  <h1>You're offline</h1>
  <p>Check your connection (Wi-Fi or mobile data) and try again. We'll be right here.</p>
  <button onclick="location.reload()">Try again</button>
</div>
<script>addEventListener('online',()=>location.reload())</script>
</body></html>
